name: Test failure status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock webhook server
        run: |
          python3 "$GITHUB_WORKSPACE/tests/mock-webhook-server.py" 18766 &
          sleep 1
          echo "Mock webhook server started on port 18766"

      - id: action
        uses: .
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: http://127.0.0.1:18766/webhook
        with:
          status: failure
          author_name: test-author
          text: "Build failed in test"
          fields: repo,commit

      - name: Assert action ran with failure status
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with status=failure (outcome=$OUTCOME)"
