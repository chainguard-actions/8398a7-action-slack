name: Test invalid status causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock Slack webhook server
        run: |
          python3 -c "
          import http.server, threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'ok')
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 18769), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          print('Mock server started on port 18769', flush=True)
          import time
          time.sleep(60)
          " &
          sleep 1
          echo "Mock server started"

      - name: Run action with invalid status (expect failure)
        id: action
        uses: .
        with:
          status: invalid_status_value
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: "http://127.0.0.1:18769/services/test/webhook"

      - name: Assert action failed with invalid status
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid status, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid status"
