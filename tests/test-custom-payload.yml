name: Test custom payload with mock webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock HTTP server
        run: |
          python3 -c "
          import http.server

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'ok')
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9996), Handler)
          server.serve_forever()
          " &
          sleep 1
          echo "Mock server started on port 9996"
      - id: action
        uses: .
        continue-on-error: true
        with:
          status: custom
          custom_payload: |
            {
              text: 'Custom notification',
              attachments: [{
                color: 'good',
                text: 'Custom payload test'
              }]
            }
        env:
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: push
          SLACK_WEBHOOK_URL: http://127.0.0.1:9996/services/FAKE/FAKE/FAKE
      - name: Assert action ran with custom status
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with status=custom input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
