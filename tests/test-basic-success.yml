name: Test basic success notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef1234
      GITHUB_WORKFLOW: Test Workflow
      GITHUB_JOB: test
      GITHUB_RUN_ID: "12345"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock HTTP server for Slack webhook
        run: |
          python3 -c "
          import http.server, threading, json, sys, os

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  print('Received payload:', body.decode(), flush=True)
                  with open('/tmp/slack_payload.json', 'w') as f:
                      f.write(body.decode())
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'ok')
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('0.0.0.0', 9999), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time
          time.sleep(120)
          " &
          sleep 2
          echo "Mock server started"
          # Verify server is listening
          curl -s -X POST http://127.0.0.1:9999/test -d '{"test":true}' -H 'Content-Type: application/json' || true

      - id: action
        uses: .
        env:
          SLACK_WEBHOOK_URL: http://127.0.0.1:9999/webhook
        with:
          status: success
          author_name: test-author
          text: "Test notification from act"
          github_token: "fake-token-for-testing"

      - name: Assert action completed and payload was sent
        run: |
          if [ ! -f /tmp/slack_payload.json ]; then
            echo "FAIL: No payload was sent to mock server"
            exit 1
          fi
          echo "Payload received:"
          cat /tmp/slack_payload.json
          echo "PASS: action completed and sent payload"
