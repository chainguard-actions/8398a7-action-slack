name: Test basic success notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock HTTP server for Slack webhook
        run: |
          # Start a simple HTTP server that accepts POST requests and returns 200
          python3 -c "
          import http.server, threading, json, sys

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  print('Received POST body:', body.decode(), flush=True)
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'ok')
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9999), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          print('Mock server started on port 9999', flush=True)
          import time; time.sleep(60)
          " &
          sleep 1
          echo "Mock server running"

      - id: action
        uses: .
        env:
          SLACK_WEBHOOK_URL: http://127.0.0.1:9999/webhook
        with:
          status: success
          author_name: test-author
          text: "Test notification from act"

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
