name: Test success status with mock webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock Slack webhook server
        run: |
          # Start a simple HTTP server that accepts POST requests and returns 200
          python3 -c "
          import http.server, threading, json, sys

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  print('Received POST body:', body.decode('utf-8', errors='replace'), flush=True)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'ok')
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 18765), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          # Write PID so we can verify it started
          import os
          print('Mock server started on port 18765', flush=True)
          # Keep alive for 60 seconds
          import time
          time.sleep(60)
          " &
          sleep 1
          echo "Mock server started"

      - name: Run action with success status
        id: action
        uses: .
        with:
          status: success
          author_name: "Test User"
          text: "Test notification"
        env:
          SLACK_WEBHOOK_URL: "http://127.0.0.1:18765/services/test/webhook"
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_NAME: push

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with mock webhook, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action succeeded with success status"
