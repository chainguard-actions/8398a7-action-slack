name: Test success status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock webhook server
        run: |
          python3 "$GITHUB_WORKSPACE/tests/mock-webhook-server.py" 18765 &
          sleep 1
          echo "Mock webhook server started on port 18765"

      - id: action
        uses: .
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: http://127.0.0.1:18765/webhook
        with:
          status: success
          author_name: test-author
          fields: repo,commit

      - name: Assert action ran successfully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with status=success (outcome=$OUTCOME)"
